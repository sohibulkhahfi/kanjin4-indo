<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Flashcard Kotoba N5-N4</title>
</head>
<body>
  <div id="header">
    <header>
        <h1>Kotoba N5-N4</h1>
    </header>

    <nav>
        <div>
            <div>
                <button onclick="showMenu('flipkanji')">Flip Kotoba</button>
                <button onclick="showMenu('listkanji')">List Kotoba</button>
            </div>
            <div>
                <select id="typeFilter" onchange="filterByType()"">
                  <option value="all">All</option>
                </select>
            </div>
        </div>
    </nav>
  </div>
  <div class="content">
    <div class="flipkanji">
      <div class="toggle-container">
        <label>
          <input type="checkbox" id="toggleHiragana" checked>
          Tampilkan hiragana
        </label>
      </div>
      <div class="cards-container" id="cardsContainer"></div> 
    </div>
    <div class="listkanji" id="listKanji" style="display: none; margin-top: 1rem;">

    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>


</body>
</html>
